version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: SeniorDesign_Postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: InvestGuard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d  # Automatically runs SQL scripts on first startup

volumes:
  pgdata: